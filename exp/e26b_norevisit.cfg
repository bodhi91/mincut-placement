# E26b: the E26 ladder with the leaf revisit pass (-end_case_passes 2,
# the default, which E26 left on in every arm) switched off, so that the
# revisit becomes the last rung: a4_positions here -> E26 a4_positions
# (= E17 `tp` = RB) -> X3 `kway_tp` (= RB+k).  Same floorplans, seed,
# threads and metric as E26.  Launch after E26 finishes:
#   screen -dmS e26b bash -c 'exp/run.sh exp/e26b_norevisit.cfg -j 10 >> results/e26b_norevisit.run.log 2>&1'
# E26: component ablation of the min-cut placer on the few-row set (the
# 180 E17 floorplans: 6 designs x 2 platforms x 60/70/80 % utilization x
# 1/2/4/6/8 rows), one seed, TritonPart, no DPO, no routing.  Cumulative
# ladder, mirroring the development-floorplan ladder of
# paper_results/tables/6_anatomy_of_gap.md (6.1):
#   a0_base      cut-net bisection, one wave, uniform whitespace, no end
#                game (cells evenly spaced in rows), no feedback pass
#   a1_waves     + two checkerboard waves (terminal update between waves)
#   a2_minlocal  + minlocal whitespace policy with adaptive balance
#   a3_endgame   + exact bisection <= 16 cells, branch-and-bound rows and
#                ordering <= 12 cells, row ironing (7 x 2); even positions
#   a4_positions + optimal in-row positions (clumping)
# The remaining rungs already exist: + leaf feedback pass = E17 `tp`
# (results/e17_krow), + k-way reassignment = X3 `kway_tp` (results/x3_mega).
# Metric: HPWL after detailed placement (pre-DPO), as everywhere else.
# Launch: exp/krow_launch.sh -j 10 exp/e26_ablation.cfg
EXP=e26b_norevisit
PLATFORMS="nangate45 asap7"
KROW_DESIGNS="gcd aes ibex jpeg swerv_no_macro cva6_no_macro"
UTILS="60 70 80"
ROWS="1 2 4 6 8"
DESIGNS=""
for d in $KROW_DESIGNS; do
  for p in $PLATFORMS; do
    for u in $UTILS; do
      for r in $ROWS; do
        DESIGNS="$DESIGNS ${d}_u${u}_r${r}_${p}"
      done
    done
  done
done
SEEDS="1"
THREADS=4
DPO=0
export MCP_NO_ROUTE=1
PAD="-pad_left \$::global_place_pad -pad_right \$::global_place_pad"
NOEND="-exact_cells 0 -optimal_cells 0 -iron_window 0 -leaf_positions even"
END="-exact_cells 16 -optimal_cells 12 -iron_window 7 -iron_passes 2"
A0="-end_case_passes 1 -k 2 -reserve uniform -density \$::global_place_density $PAD -waves 1 $NOEND -feedback_passes 0"
A1="-end_case_passes 1 -k 2 -reserve uniform -density \$::global_place_density $PAD -waves 2 $NOEND -feedback_passes 0"
A2="-end_case_passes 1 -k 2 -reserve minlocal -density \$::global_place_density -max_tolerance 1.0 $PAD -waves 2 $NOEND -feedback_passes 0"
A3="-end_case_passes 1 -k 2 -reserve minlocal -density \$::global_place_density -max_tolerance 1.0 $PAD -waves 2 $END -leaf_positions even -feedback_passes 0"
A4="-end_case_passes 1 -k 2 -reserve minlocal -density \$::global_place_density -max_tolerance 1.0 $PAD -waves 2 $END -leaf_positions optimal -feedback_passes 0"
VARIANTS=(
  "a0_base|mincut|$A0"
  "a1_waves|mincut|$A1"
  "a2_minlocal|mincut|$A2"
  "a3_endgame|mincut|$A3"
  "a4_positions|mincut|$A4"
)
MEM_MIN_GB=40
MEM_MAX_GB=120
