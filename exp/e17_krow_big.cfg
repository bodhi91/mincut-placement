# E17 (large designs): swerv_no_macro and cva6_no_macro of the k-row floorplans (k-row-floorplans/floorplan: 6 designs x 2
# platforms x 60/70/80 % utilization x 1/2/4/6/8 rows = 180 floorplans, I/O
# pins on the bottom edge, no taps / PDN) with gpl, Capo and mcp under each
# of its four engines; checkpoints from bench/make_krow_checkpoints.tcl.
# Settings reproduce the flow that made the floorplans: target density
# 0.70 / 0.71 / 0.81 (vars.tcl, by utilization), no padding anywhere.
# E12/E16 conditions otherwise: DPO=1, -feedback_passes 1, 4 threads.
#   gpl   global_placement as k-row-floorplans/replace (the floorplan author's
#         baseline): -disable_pin_density_adjust -overflow 0.2; with the
#         defaults (overflow 0.1, pin-density inflation) gpl is 5-20 % worse on
#         the 1-row floorplans (gcd 20 072 vs 16 318 um)
#   capo  Capo 10.5, -densityTarget <flow density %>, no padding
#   tp / hm / mk / fp   mcp with TritonPart / hMETIS / Mt-KaHyPar / FastPart
# CAPO = path to CapoTest1.exe (LD_LIBRARY_PATH must contain UMpack/lib).
# Launch: exp/krow_launch.sh (screen session, survives a disconnect).
# swerv / cva6 are in exp/e17_krow_big.cfg (same results folder, DPO=0:
# improve_placement ran for hours on their 1-2-row floorplans).
EXP=e17_krow
PLATFORMS="nangate45 asap7"
# cva6 runs from exp/e17_krow_cva6.cfg (sources this file, overrides
# KROW_DESIGNS and the memory gates) so that the two passes can run in
# parallel screens; this file alone does swerv.
KROW_DESIGNS="${KROW_DESIGNS:-swerv_no_macro}"
UTILS="60 70 80"
ROWS="1 2 4 6 8"
DESIGNS=""
for d in $KROW_DESIGNS; do
  for p in $PLATFORMS; do
    for u in $UTILS; do
      for r in $ROWS; do
        DESIGNS="$DESIGNS ${d}_u${u}_r${r}_${p}"
      done
    done
  done
done
SEEDS="1"
THREADS=4
# No DPO: dpl's improve_placement (independent-set matching, single
# thread) ran for 3+ hours on the 1-2-row swerv floorplans (79 k cells in
# one 177 mm row).  The primary metric, hpwl_dpl, is unaffected; routing
# then starts from the legalized placement.
DPO=0
CAPO="${CAPO:-/path/to/UMpack/Capo/CapoTest1.exe}"
HMETIS="$ROOT/tools/hmetis/hmetis_driver"
MTKAHYPAR="${MTKAHYPAR:-/path/to/MtKaHyPar}"
FASTPART="$ROOT/tools/fastpart/fastpart_driver.py"
MCP="-k 2 -reserve minlocal -density \$::global_place_density -max_tolerance 1.0 -pad_left \$::global_place_pad -pad_right \$::global_place_pad -optimal_cells 12 -feedback_passes 1"
VARIANTS=(
  "gpl|gpl|krow"
  "capo|capo|-densityTarget [expr {int(round(100*\$::global_place_density))}]|\$::global_place_pad"
  "tp|mincut|$MCP"
  "hm|mincut|$MCP -engine hmetis -hmetis_path $HMETIS"
  "mk|mincut|$MCP -engine mtkahypar -mtkahypar_path $MTKAHYPAR"
  "fp|mincut|$MCP -engine fastpart -fastpart_path $FASTPART"
)
# 80 k cells: global_route reaches 100+ GB on the 1-2-row dies before it
# dies; fewer workers (-j 6), stricter gates.
MEM_MIN_GB=80
MEM_MAX_GB=100
