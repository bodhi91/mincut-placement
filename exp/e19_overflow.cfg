# E19 (HYBRID_PLACEMENT_PLAN.md step 2): the central hypothesis.  Does the
# capacity-exact decomposition plus the end game spread cells at lower HPWL
# cost than gpl's density penalty does?  gpl is stopped early -- at density
# overflow tau instead of its default 0.1 -- so that the global structure is
# there but the late high-penalty iterations are not; the transport
# decomposition (children's physical capacities at the flow density) and
# the end game do the remaining spreading.  All arms under DPO.
#   ovf50 / ovf30 / ovf20      gpl -overflow tau seed -> transport_only,
#                              seed terminals -> end game
# Compare with results/e18_endgame_dpo: gpl (baseline) and gpl_tonly_st
# (= tau 0.1, the fully spread seed).  Also read seed_distance per level in
# the .mcp.json: how far the transport had to move cells from the seed.
# Decision: best tau beats tau 0.1 by >= 2 % on aes/ibex -> the hypothesis
# stands and tau sets the oracle's level-0 overflow; otherwise the hybrid's
# target becomes parity on ORFS + robustness on k-row.
EXP=e19_overflow
OPENROAD="$ROOT/OpenROAD/build/bin/openroad"
DESIGNS="gcd_nangate45 aes_nangate45 ibex_sky130hd"
SEEDS="1 2 3"
THREADS=4
DPO=1
MCP="-k 2 -reserve minlocal -density \$::global_place_density -max_tolerance 1.0 -pad_left \$::global_place_pad -pad_right \$::global_place_pad -optimal_cells 12"
SEEDED="$MCP -seed_placement -assignment transport_only -seed_terminals"
VARIANTS=(
  "ovf50|mincut|$SEEDED|none|gpl_ovf0.5"
  "ovf30|mincut|$SEEDED|none|gpl_ovf0.3"
  "ovf20|mincut|$SEEDED|none|gpl_ovf0.2"
)
