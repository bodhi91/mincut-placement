# E24a: hybrid B (min-cut decides, analytical informs: QP oracle terminals +
# ACG whitespace, the adaptive setting of HYBRID_PLACEMENT_PLAN.md s9.2 /
# E21d-e) on the E17 k-row floorplans, so that it can be compared with the
# E17 arms (results/e17_krow: gpl, capo, tp, hm, mk, fp) floorplan by
# floorplan.  Same designs, settings and evaluation as exp/e17_krow.cfg
# (120 floorplans: {gcd, aes, ibex, jpeg} x {nangate45, asap7} x {60, 70, 80 %}
# x {1, 2, 4, 6, 8} rows; swerv / cva6 are in exp/e17_krow_big.cfg, not run
# here); two engines: TritonPart (the default hybrid) and FastPart (the best
# engine with the hybrid on aes, E21e).
# Binary: OpenROAD/build/bin/openroad, a frozen copy of
# build-e23/bin/openroad (hybrid code at the b3 state + -soft_blockages;
# reproduces e21e gcd to the decimal).  Compare with
# python3 /path/to/cmp_e24.py or exp/krow_summary.py.
# Launch: exp/e24_launch.sh (screen "e24_hyb": this file, then
# exp/e24_hyb_base.cfg).
EXP=e24_hyb_krow
# Scratch (checkpoints in flight) in the workspace, not /tmp (2026-11-02).
export MCP_SCRATCH="$ROOT/scratch/$EXP"
OPENROAD="$ROOT/OpenROAD/build/bin/openroad"
PLATFORMS="nangate45 asap7"
KROW_DESIGNS="gcd aes ibex jpeg"
UTILS="60 70 80"
ROWS="1 2 4 6 8"
DESIGNS=""
for d in $KROW_DESIGNS; do
  for p in $PLATFORMS; do
    for u in $UTILS; do
      for r in $ROWS; do
        DESIGNS="$DESIGNS ${d}_u${u}_r${r}_${p}"
      done
    done
  done
done
SEEDS="1"
THREADS=4
DPO=1
FASTPART="$ROOT/tools/fastpart/fastpart_driver.py"
COMMON="-k 2 -density \$::global_place_density -max_tolerance 1.0 -pad_left \$::global_place_pad -pad_right \$::global_place_pad -optimal_cells 12 -feedback_passes 1"
HYB="$COMMON -reserve acg -balance_tolerance 0.5 -oracle qp -oracle_anchor 1 -oracle_anchor_util 1"
VARIANTS=(
  "tp_hyb|mincut|$HYB"
  "fp_hyb|mincut|$HYB -engine fastpart -fastpart_path $FASTPART"
)
MEM_MIN_GB=40
MEM_MAX_GB=120
