# E25: partitioner objectives.  How does the objective the partitioner
# optimizes at every bisection change the final HPWL of the min-cut placer?
# Nine representative floorplans (5 k-row, 4 base_designs AR-1), the E17 /
# E23 placer settings, and these arms (names = result variant names):
#
#   arm 0  cutnet_{tp,hm,mk,fp}   control: unit-weight cut nets (E17/E23 tp/hm/mk/fp)
#   arm 1  exphpwl_{tp,hm,mk,fp}  degree-dependent net weights: expected HPWL
#                                 gain of uncutting a d-pin net (1 at d=2 -> 1.5)
#          invdeg_{tp,hm,mk,fp}   1/(d-1) net weights (a cut net costs its spanning-tree share)
#   arm 2  phpwl_tp               probabilistic HPWL vector objective (-objective phpwl)
#   arm 3  hpwl_l2_tp, hpwl_l4_tp level switch: geometric HPWL vectors above level L,
#                                 cutnet from level L on (zero code: -fine_objective)
#   arm 4  ratio_tp, ncut_tp      the objective places the cut line: sweep the balance
#                                 fraction {0.3..0.7} +-0.05 and keep the min ratio cut /
#                                 normalized cut
#   arm 5  sparsest_tp            geometric sparsest cut: partition both directions and
#                                 keep the fewer cut nets per unit cut-line length
#   arm 6  timing_tp              STA-derived net weights 1 + 4 c, c = (T - slack)/(T - WNS)
#                                 (k-row designs only: the base_designs SDCs have no I/O
#                                 constraints, so every path is clock-to-clock there too but
#                                 the floorplans were not made for timing; kept to k-row)
#   gpl                           RePlAce reference (krow mode, as E17/E23)
#
# Binary: OpenROAD/build-e25 (E23's source + the E25 options; the defaults
# reproduce E17/E23 bit for bit -- regression in results/e25_objectives/STATUS.md).
# E23 keeps running on build-e23; this build is separate on purpose.
#
# Design groups (E25_SET), mirroring the E17 / E23 conditions of each design:
#   krow_small  aes_u70_r2_nangate45 ibex_u70_r6_nangate45      3 seeds, DPO
#   krow_mid    jpeg_u70_r8_asap7                              1 seed,  DPO
#   krow_big    swerv_no_macro_u60_r1_nangate45                1 seed,  no DPO (E17 big)
#               cva6_no_macro_u70_r2_nangate45
#   base_small  aes_ar1_nangate45 ibex_ar1_asap7                3 seeds, DPO, soft blockages
#   base_big    cva6_ar1_asap7 mempool_tile_ar1_nangate45       1 seed,  DPO, soft blockages
# Arm groups (E25_ARMS): A = gpl + arms 0/1/3 (cheap, all engines),
#   B = arms 2/4/5/6 (tp).  Launch: exp/e25_launch.sh (screen "e25_obj").
EXP=e25_objectives
OPENROAD="$ROOT/OpenROAD/build/bin/openroad"
E25_SET="${E25_SET:-krow_small}"
E25_ARMS="${E25_ARMS:-A}"
THREADS=4
case "$E25_SET" in
  krow_small) DESIGNS="aes_u70_r2_nangate45 ibex_u70_r6_nangate45"; SEEDS="1 2 3"; DPO=1; BASE=0 ;;
  krow_mid)   DESIGNS="jpeg_u70_r8_asap7"; SEEDS="1"; DPO=1; BASE=0 ;;
  # global_route exhausted 100+ GB on these two in E17 (no routed WL there
  # either); the study's metric is HPWL, so routing is skipped.
  krow_big)   DESIGNS="swerv_no_macro_u60_r1_nangate45 cva6_no_macro_u70_r2_nangate45"; SEEDS="1"; DPO=0; BASE=0; export MCP_NO_ROUTE=1 ;;
  base_small) DESIGNS="aes_ar1_nangate45 ibex_ar1_asap7"; SEEDS="1 2 3"; DPO=1; BASE=1 ;;
  base_big)   DESIGNS="cva6_ar1_asap7 mempool_tile_ar1_nangate45"; SEEDS="1"; DPO=1; BASE=1 ;;
  *) echo "E25_SET=$E25_SET unknown" >&2; exit 1 ;;
esac
HMETIS="$ROOT/tools/hmetis/hmetis_driver"
MTKAHYPAR="${MTKAHYPAR:-/path/to/MtKaHyPar}"
FASTPART="$ROOT/tools/fastpart/fastpart_driver.py"
MCP="-k 2 -reserve minlocal -density \$::global_place_density -max_tolerance 1.0 -pad_left \$::global_place_pad -pad_right \$::global_place_pad -optimal_cells 12 -feedback_passes 1"
if [[ $BASE -eq 1 ]]; then
  MCP="$MCP -soft_blockages block"
  export MCP_CAPO_SOFT_BLOCKAGES=block
fi
HM="-engine hmetis -hmetis_path $HMETIS"
MK="-engine mtkahypar -mtkahypar_path $MTKAHYPAR"
FP="-engine fastpart -fastpart_path $FASTPART"
VARIANTS=()
case "$E25_ARMS" in
  *A*)
    VARIANTS+=(
      "gpl|gpl|krow"
      "cutnet_tp|mincut|$MCP"
      "cutnet_hm|mincut|$MCP $HM"
      "cutnet_mk|mincut|$MCP $MK"
      "cutnet_fp|mincut|$MCP $FP"
      "exphpwl_tp|mincut|$MCP -net_weight exphpwl"
      "exphpwl_hm|mincut|$MCP $HM -net_weight exphpwl"
      "exphpwl_mk|mincut|$MCP $MK -net_weight exphpwl"
      "exphpwl_fp|mincut|$MCP $FP -net_weight exphpwl"
      "invdeg_tp|mincut|$MCP -net_weight invdeg"
      "invdeg_hm|mincut|$MCP $HM -net_weight invdeg"
      "invdeg_mk|mincut|$MCP $MK -net_weight invdeg"
      "invdeg_fp|mincut|$MCP $FP -net_weight invdeg"
      "hpwl_l2_tp|mincut|$MCP -objective hpwl -fine_objective cutnet -fine_level 2"
      "hpwl_l4_tp|mincut|$MCP -objective hpwl -fine_objective cutnet -fine_level 4"
    ) ;;
esac
case "$E25_ARMS" in
  *B*)
    VARIANTS+=(
      "phpwl_tp|mincut|$MCP -objective phpwl"
      "ratio_tp|mincut|$MCP -balance_objective ratio"
      "ncut_tp|mincut|$MCP -balance_objective ncut"
      "sparsest_tp|mincut|$MCP -cut_direction sparsest"
    )
    if [[ $BASE -eq 0 ]]; then
      VARIANTS+=( "timing_tp|mincut|$MCP|none|timing" )
    fi ;;
esac
[[ ${#VARIANTS[@]} -gt 0 ]] || { echo "E25_ARMS=$E25_ARMS selects no arm" >&2; exit 1; }
MEM_MIN_GB="${MEM_MIN_GB:-60}"
MEM_MAX_GB="${MEM_MAX_GB:-120}"
