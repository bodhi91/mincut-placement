# Smoke test / M0 acceptance: gpl default twice (reproducibility), the other
# gpl modes once, and one min-cut configuration per engine.
EXP=e0_smoke
DESIGNS="gcd_nangate45"
SEEDS="1 2"
THREADS=4
HMETIS="$ROOT/tools/hmetis/hmetis_driver"
VARIANTS=(
  "gpl_default|gpl|default"
  "gpl_td|gpl|timing_driven"
  "gpl_rd|gpl|routability_driven"
  "mcp_tp_k2|mincut|-k 2 -engine tritonpart"
  "mcp_fm_k2|mincut|-k 2 -engine fm"
  "mcp_hm_k2|mincut|-k 2 -engine hmetis -hmetis_path $HMETIS"
)
