# E27: attribution of RB (TP)'s advantage over Capo 10.5 on the 180 few-row
# floorplans (6 designs x 2 platforms x 60/70/80 % x 1/2/4/6/8 rows), one
# seed, no DPO, no routing -- the E26 conditions.  Metric: HPWL after
# detailed placement / Capo on the same floorplan (results/e17_krow capo).
# Completes the E26 cumulative ladder (a0_base .. a4_positions = RB (TP))
# and the E17 / X3 engine arms with:
#
#   leave-one-out on the full RB (TP) configuration
#   full        RB (TP) on this binary (control; must reproduce E17 tp /
#               E26 a4_positions)
#   no_exact    -exact_cells 0      regions <= 16 cells go to the heuristic
#                                   partitioner like every other region
#   no_optimal  -optimal_cells 0    leaves keep the heuristic row assignment
#                                   and order (ironing still on)
#   no_iron     -iron_window 0      no sliding-window reordering
#   rows_only   -optimal_rows 0     the leaf branch and bound searches only
#                                   the order within each row; the heuristic
#                                   cells-to-rows assignment stands (the
#                                   single-row end case; identical to full
#                                   on one-row floorplans)
#
#   partitioner at the base rung (E26 a0_base with the engine swapped)
#   a0_hm       hMETIS      (Capo's MLPart class: multilevel FM)
#   a0_fm       flat FM     (TritonPart with coarsening disabled)
#
# 7 arms x 180 floorplans = 1260 runs.  Binary: OpenROAD/build-kway/snap/
# openroad-e27 (the X3 source plus -optimal_rows; defaults unchanged).
# Launch (detached screen "e27_capo_attr", log results/e27_capo_attr.run.log):
#   screen -dmS e27_capo_attr bash -c "exp/run.sh exp/e27_capo_attr.cfg -j 6 >> results/e27_capo_attr.run.log 2>&1"
EXP=e27_capo_attr
OPENROAD="$ROOT/OpenROAD/build/bin/openroad"
PLATFORMS="nangate45 asap7"
KROW_DESIGNS="gcd aes ibex jpeg swerv_no_macro cva6_no_macro"
UTILS="60 70 80"
ROWS="1 2 4 6 8"
DESIGNS=""
for d in $KROW_DESIGNS; do
  for p in $PLATFORMS; do
    for u in $UTILS; do
      for r in $ROWS; do
        DESIGNS="$DESIGNS ${d}_u${u}_r${r}_${p}"
      done
    done
  done
done
SEEDS="1"
THREADS=4
DPO=0
export MCP_NO_ROUTE=1
MEM_MIN_GB="${MEM_MIN_GB:-40}"
MEM_MAX_GB="${MEM_MAX_GB:-100}"
HMETIS="$ROOT/tools/hmetis/hmetis_driver"
PAD="-pad_left \$::global_place_pad -pad_right \$::global_place_pad"
# The E17 / X3 RB (TP) configuration (defaults: -exact_cells 16
# -optimal_cells 12 -iron_window 7 -iron_passes 2 -leaf_positions optimal
# -end_case_passes 2 -waves 2).
FULL="-k 2 -reserve minlocal -density \$::global_place_density -max_tolerance 1.0 $PAD -optimal_cells 12 -feedback_passes 1"
# E26 a0_base.
NOEND="-exact_cells 0 -optimal_cells 0 -iron_window 0 -leaf_positions even"
A0="-k 2 -reserve uniform -density \$::global_place_density $PAD -waves 1 $NOEND -feedback_passes 0"
VARIANTS=(
  "full|mincut|$FULL"
  "no_exact|mincut|$FULL -exact_cells 0"
  "no_optimal|mincut|$FULL -optimal_cells 0"
  "no_iron|mincut|$FULL -iron_window 0"
  "rows_only|mincut|$FULL -optimal_rows 0"
  "a0_hm|mincut|$A0 -engine hmetis -hmetis_path $HMETIS"
  "a0_fm|mincut|$A0 -engine fm"
)
[[ -n "${E27_VARIANTS:-}" ]] && VARIANTS=( "${E27_VARIANTS[@]}" )
