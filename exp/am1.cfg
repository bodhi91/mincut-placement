# AM-1: connectivity versus geometry in one tree (AMERICAN_MAPS_STUDY.md
# sections 4-5, 7).  The min-cut split and the American-map split (the
# capacitated min-displacement assignment of a gpl -overflow 0.3 seed,
# src/mcp/src/Assignment.cpp) swapped level by level inside the same
# tree, same capacity policy, same end game, same DPO, on six floorplans
# chosen so that every hypothesis has a clean test:
#   aes_ar1_nangate45, ibex_ar1_asap7, jpeg_ar1_nangate45     square, no macros
#   swerv_wrapper_ar1_nangate45                               square, fixed macros
#   ibex_u70_r8_asap7, jpeg_u70_r4_nangate45                  k-row (same netlist
#                                                             and PDK as the ibex /
#                                                             jpeg squares)
# Three seeds.  Settings as x3_mega (E17 / E23 conditions): THREADS=4,
# DPO=1, routed, -reserve minlocal, -max_tolerance 1.0, soft blockages
# blocked (no effect on the k-row floorplans, which have none), gpl in
# krow mode (-disable_pin_density_adjust -overflow 0.2).  Legalizer: dpl's
# default (negotiation), as x3_mega; all six gpl runs legalized there.
#
# Arm waves (AM1_WAVE):
#   core    gpl, X (= x3 cutnet_tp), X_kway (= x3 kway_tp), AM2_t30 (American
#           map at every level, with the disagreement diagnostic alongside),
#           MC_diag (min-cut decides at every level with the seed as
#           terminals; American map computed and compared), AMx (American
#           map seeded by X's own result: the faithfulness control), seed
#           (gpl -overflow 0.3 legalized on its own)
#   levels  AM2_notL, L = 1..6 (American map everywhere except level L,
#           min-cut at L: the consequence of one level's disagreement);
#           AM2_LL, L = 2, 4, 6 (American map above L, min-cut below)
#   extra   AM4_t30 (quadrisection), AMl_t30 (net-aware transport, lambda
#           0.5), AMg (seed = full gpl), AMc (seed = Capo; needs CAPO and
#           MCP_CAPO_ARGS), AM2_t50 / AM2_t70 (seed = gpl -overflow 0.5 /
#           0.7) with seed50 / seed70 (those seeds legalized on their own)
#
# Binary: OpenROAD/build/bin/openroad (x3 source + -am_diagnose /
# -am_commit / -am_mincut_levels / transport timer; defaults reproduce x3).
# Launch (host-B only): exp/am1_launch.sh.  Results: results/am1.
EXP=am1
OPENROAD="$ROOT/OpenROAD/build/bin/openroad"
AM1_WAVE="${AM1_WAVE:-core}"
DESIGNS="aes_ar1_nangate45 ibex_ar1_asap7 jpeg_ar1_nangate45 swerv_wrapper_ar1_nangate45 ibex_u70_r8_asap7 jpeg_u70_r4_nangate45"
SEEDS="${SEEDS:-1 2 3}"
THREADS=4
DPO=1
MEM_MIN_GB="${MEM_MIN_GB:-40}"
MEM_MAX_GB="${MEM_MAX_GB:-120}"
export MCP_CAPO_SOFT_BLOCKAGES=block
# Capo seed (arm AMc): UMpack's CapoTest1 on the local disk of the host.
CAPO="${CAPO:-/tmp/$USER/UMpack/Capo/CapoTest1.exe}"
# (not a ${:-} default: the Tcl braces would close the bash expansion)
[[ -n "${MCP_CAPO_ARGS:-}" ]] || MCP_CAPO_ARGS="-densityTarget [expr {int(round(100*\$::global_place_density))}]"
export MCP_CAPO_ARGS
export MCP_CAPO_PAD="${MCP_CAPO_PAD:-\$::global_place_pad}"

MCP="-k 2 -reserve minlocal -density \$::global_place_density -max_tolerance 1.0 -pad_left \$::global_place_pad -pad_right \$::global_place_pad -optimal_cells 12 -feedback_passes 1 -soft_blockages block"
AM="$MCP -seed_placement -seed_terminals -assignment transport_only"
VARIANTS=()
case "$AM1_WAVE" in
  core)
    VARIANTS+=(
      "gpl|gpl|krow"
      "X|mincut|$MCP"
      "X_kway|mincut|$MCP -kway_refine_levels {2 3 4 5}"
      "AM2_t30|mincut|$AM -am_diagnose|none|gpl_ovf0.3"
      "MC_diag|mincut|$AM -am_diagnose -am_commit mincut|none|gpl_ovf0.3"
      "AMx|mincut|$MCP -feedback_passes 2 -feedback_assignment transport_only -feedback_weight 0"
      "seed|gpl|ovf0.3"
    ) ;;
  levels)
    for L in 1 2 3 4 5 6; do
      VARIANTS+=( "AM2_not${L}|mincut|$AM -am_mincut_levels {$L}|none|gpl_ovf0.3" )
    done
    for L in 2 4 6; do
      VARIANTS+=( "AM2_L${L}|mincut|$AM -seed_levels $L|none|gpl_ovf0.3" )
    done ;;
  extra)
    VARIANTS+=(
      "AM4_t30|mincut|$AM -k 4|none|gpl_ovf0.3"
      "AMl_t30|mincut|$AM -assignment_net_weight 0.5|none|gpl_ovf0.3"
      "AMg|mincut|$AM|none|gpl"
      "AM2_t50|mincut|$AM|none|gpl_ovf0.5"
      # Seed-quality sweep (H-AM5 control): the same seed legalized on its
      # own at each overflow, so AM2_t<tau> - seed<tau> is the transport's
      # own contribution.  In the core wave seed (tau 0.3) came out *better*
      # than AM2_t30 on aes/ibex/jpeg: the gpl krow baseline stops at
      # overflow 0.2, so tau 0.3 is nearly the finished placement.
      "AM2_t70|mincut|$AM|none|gpl_ovf0.7"
      "seed50|gpl|ovf0.5"
      "seed70|gpl|ovf0.7"
    )
    [[ -x "$CAPO" ]] && VARIANTS+=( "AMc|mincut|$AM|none|capo" ) \
      || echo "am1: CAPO '$CAPO' not executable on $(hostname); arm AMc skipped" >&2 ;;
  *) echo "AM1_WAVE=$AM1_WAVE unknown (core|levels|extra)" >&2; exit 1 ;;
esac
