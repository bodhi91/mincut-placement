# E19b (HYBRID_PLACEMENT_PLAN.md step 2, follow-up): min-cut refinement on
# the early-stopped gpl seed.  E19 showed that at overflow tau 0.5 the
# decomposition of the half-spread seed is 1.041x gpl *before*
# improve_placement and 0.929x *after* on aes: the global structure is
# right, the local side-of-cut errors are left to dpl.  Here the partitioner
# refines the transport split with the displacement tether (E11's
# -assignment transport -displacement_weight delta -seed_terminals) so that
# the placer fixes them itself.  Direct evidence for / against the band
# partitioning component of the hybrid, and the starting delta.
#   t<tau>_d<delta>   gpl -overflow tau seed -> transport + refinement with
#                     tether delta, seed terminals -> end game, DPO
# Compare with results/e19_overflow (transport_only at the same tau) and
# results/e18_endgame_dpo (gpl).  Watch hpwl_dpl (pre-DPO) as much as hpwl.
EXP=e19b_refine
OPENROAD="$ROOT/OpenROAD/build/bin/openroad"
DESIGNS="gcd_nangate45 aes_nangate45 ibex_sky130hd"
SEEDS="1 2 3"
THREADS=4
DPO=1
MCP="-k 2 -reserve minlocal -density \$::global_place_density -max_tolerance 1.0 -pad_left \$::global_place_pad -pad_right \$::global_place_pad -optimal_cells 12"
SEEDED="$MCP -seed_placement -assignment transport -seed_terminals"
VARIANTS=(
  "t30_d03|mincut|$SEEDED -displacement_weight 0.3|none|gpl_ovf0.3"
  "t30_d1|mincut|$SEEDED -displacement_weight 1|none|gpl_ovf0.3"
  "t50_d03|mincut|$SEEDED -displacement_weight 0.3|none|gpl_ovf0.5"
  "t50_d1|mincut|$SEEDED -displacement_weight 1|none|gpl_ovf0.5"
)
