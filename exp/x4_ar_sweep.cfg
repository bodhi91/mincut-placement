# X4: the X1b whole-level k-way refinement on the floorplan author's AR x utilization
# sweep (external).  the floorplan author's
# DOE is 4 aspect ratios {0.03, 0.06, 0.09, 1} x 3 target utilizations
# {60, 70, 80} x 2 PDKs {asap7, nangate45} x the macro-free designs
# (REMOVE_MACROS=1 in the floorplan author's run_flow.tcl).  The floorplan.odb per point is the
# unplaced floorplan (FP at the target AR/util, IO pins placed+fixed, std
# cells unplaced) staged under scratch/ar_sweep/odb and wrapped as
# techless checkpoints bench/designs/sweep_<design>_<arXpYY>_<utilZZ>_<pdk>
# (scratch/ar_sweep/make_sweep_checkpoints.py).  HPWL-only, MCP_NO_ROUTE=1.
#
#   gpl        RePlAce reference (krow mode: -disable_pin_density_adjust
#              -overflow 0.2), the same baseline the floorplan author's summary.csv reports
#   cutnet_tp  the E25 control: unit-weight cut nets, TritonPart, terminal
#              propagation (E17/E23/E25 placer settings)
#   kway_tp    cutnet_tp + -kway_refine_levels {2 3 4 5}: after levels 2..5 are
#              committed, the assignment of all cells to the level's 4/8/16/32
#              regions is refined as one Steiner-tree mapping (Mt-KaHyPar
#              V-cycles, every region keeping its cell area x 1.02, pins fixed),
#              kept only if the HPWL at the region centers improves
#
# Binary: OpenROAD/build/bin/openroad (the k-way build; defaults
# reproduce E25 bit for bit).  E23/E25 keep running on their own builds.
#
# Design groups (X4_SET):
#   small   gcd aes ibex jpeg  (86 checkpoints)  3 seeds, DPO
#   big     swerv cva6 mempool_tile xiangshan (96)  3 seeds, no DPO
# Launch: exp/x4_launch.sh (one screen session per design group).
EXP=x4_ar_sweep
OPENROAD="$ROOT/OpenROAD/build/bin/openroad"
THREADS=4
export MCP_NO_ROUTE=1

# Design lists (SWEEP_SMALL / SWEEP_BIG) generated with the checkpoints.
source "$ROOT/exp/x4_designs.txt"

X4_SET="${X4_SET:-small}"
case "$X4_SET" in
  small) DESIGNS="$SWEEP_SMALL"; SEEDS="1 2 3"; DPO=1 ;;
  big)   DESIGNS="$SWEEP_BIG";   SEEDS="1 2 3"; DPO=0 ;;
  *) echo "X4_SET=$X4_SET unknown (small|big)" >&2; exit 1 ;;
esac
# Staging knobs for a second runner (exp/x4_launch_pdn.sh): X4_SEEDS
# overrides the seed list (seed 1 across every cell first, then 2 3);
# X4_DESIGN_RE keeps only the designs matching an extended regex (the fast
# big designs before xiangshan, whose mincut runs take ~2.5 h each).
[[ -n "${X4_SEEDS:-}" ]] && SEEDS="$X4_SEEDS"
if [[ -n "${X4_DESIGN_RE:-}" ]]; then
  DESIGNS="$(tr ' ' '\n' <<< "$DESIGNS" | grep -E "$X4_DESIGN_RE" | tr '\n' ' ')"
fi

MCP="-k 2 -reserve minlocal -density \$::global_place_density -max_tolerance 1.0 -pad_left \$::global_place_pad -pad_right \$::global_place_pad -optimal_cells 12 -feedback_passes 1"
VARIANTS=(
  "gpl|gpl|krow"
  "cutnet_tp|mincut|$MCP"
  "kway_tp|mincut|$MCP -kway_refine_levels {2 3 4 5}"
)
MEM_MIN_GB="${MEM_MIN_GB:-20}"
MEM_MAX_GB="${MEM_MAX_GB:-120}"
