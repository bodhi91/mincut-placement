# X3 mega run: the latest placer on ALL floorplans.  The min-cut placer with
# the X1b whole-level k-way refinement (results/x1b_kway/STATUS.md: -1.2 %
# post-DPO HPWL, 12/13 paired wins on the small grid) against its own
# baseline and RePlAce on the 180 k-row floorplans and the 20 base_designs
# AR-1 floorplans, with the E17 / E23 / E25 settings, seed 1.
#
#   gpl        RePlAce reference (krow mode: -disable_pin_density_adjust
#              -overflow 0.2, as the floorplan authors ran it)
#   cutnet_tp  the E25 control: unit-weight cut nets, TritonPart, terminal
#              propagation, -reserve minlocal, exact end game
#   kway_tp    cutnet_tp + -kway_refine_levels {2 3 4 5}: after levels 2..5
#              are committed the assignment of all cells to the level's
#              4 / 8 / 16 / 32 regions is refined as one Steiner-tree mapping
#              (Mt-KaHyPar V-cycles, each region keeping its cell area x 1.02,
#              pins fixed), kept only if the HPWL at the region centers improves
#
# Binary: OpenROAD/build/bin/openroad (E25 source + X0/X1a/X1b/X2
# options, linked with tools/mtkahypar/lib; defaults reproduce E25 bit for
# bit).  E23 / E25 keep running on their own builds.
#
# Design groups (X3_SET):
#   krow_small  gcd aes ibex jpeg x {nangate45 asap7} x u{60,70,80} x r{1,2,4,6,8}
#               = 120 floorplans, DPO, routed                       (E17 conditions)
#   krow_big    swerv_no_macro cva6_no_macro, same grid = 60 floorplans,
#               no DPO (improve_placement ran for hours on 1-2-row dies),
#               no routing (global_route exhausted 100+ GB in E17)  (E17 big)
#   base_small  gcd aes ibex jpeg swerv_wrapper cva6 mempool_tile xiangshan
#               x {nangate45 asap7} = 16 floorplans, DPO, soft blockages (E23)
#   base_big    megaboom mempool_group x {nangate45 asap7} = 4 floorplans
#               (1.7-3.0 M cells), no DPO, soft blockages           (E23 big)
# 200 floorplans x 3 arms = 600 runs.  Launch: exp/x3_mega_launch.sh (two
# screens, "x3_mega_krow" and "x3_mega_base"); every pass is resumable.
EXP=x3_mega
OPENROAD="$ROOT/OpenROAD/build/bin/openroad"
X3_SET="${X3_SET:-krow_small}"
THREADS=4
SEEDS="1"
krow_grid() {  # <designs...> -> DESIGNS over platforms x utilizations x rows
  local d p u r
  DESIGNS=""
  for d in "$@"; do
    for p in nangate45 asap7; do
      for u in 60 70 80; do
        for r in 1 2 4 6 8; do
          DESIGNS="$DESIGNS ${d}_u${u}_r${r}_${p}"
        done
      done
    done
  done
}
base_grid() {  # <designs...> -> DESIGNS over platforms (AR-1 base floorplans)
  local d p
  DESIGNS=""
  for d in "$@"; do
    for p in nangate45 asap7; do
      DESIGNS="$DESIGNS ${d}_ar1_${p}"
    done
  done
}
case "$X3_SET" in
  krow_small) krow_grid gcd aes ibex jpeg; DPO=1; BASE=0
              MEM_MIN_GB="${MEM_MIN_GB:-40}";  MEM_MAX_GB="${MEM_MAX_GB:-120}" ;;
  krow_big)   krow_grid swerv_no_macro cva6_no_macro; DPO=0; BASE=0; export MCP_NO_ROUTE=1
              MEM_MIN_GB="${MEM_MIN_GB:-80}";  MEM_MAX_GB="${MEM_MAX_GB:-100}" ;;
  base_small) base_grid gcd aes ibex jpeg swerv_wrapper cva6 mempool_tile xiangshan; DPO=1; BASE=1
              MEM_MIN_GB="${MEM_MIN_GB:-80}";  MEM_MAX_GB="${MEM_MAX_GB:-150}" ;;
  base_big)   base_grid megaboom mempool_group; DPO=0; BASE=1
              MEM_MIN_GB="${MEM_MIN_GB:-120}"; MEM_MAX_GB="${MEM_MAX_GB:-220}" ;;
  *) echo "X3_SET=$X3_SET unknown" >&2; exit 1 ;;
esac
MCP="-k 2 -reserve minlocal -density \$::global_place_density -max_tolerance 1.0 -pad_left \$::global_place_pad -pad_right \$::global_place_pad -optimal_cells 12 -feedback_passes 1"
if [[ $BASE -eq 1 ]]; then
  MCP="$MCP -soft_blockages block"
  export MCP_CAPO_SOFT_BLOCKAGES=block
fi
VARIANTS=(
  "gpl|gpl|krow"
  "cutnet_tp|mincut|$MCP"
  "kway_tp|mincut|$MCP -kway_refine_levels {2 3 4 5}"
)
# Clean-up passes (exp/x3_mega_rerun.sh): X3_DESIGNS restricts the set's
# grid to the listed floorplans; X3_VARIANTS=gpl_dia replaces the arms by
# the gpl baseline legalized with dpl's diamond legalizer (the caller
# exports MCP_DPL_DIAMOND=1), for the floorplans where the negotiation
# legalizer fails (DPL-0033).
[[ -n "${X3_DESIGNS:-}" ]] && DESIGNS="$X3_DESIGNS"
[[ "${X3_VARIANTS:-}" == gpl_dia ]] && VARIANTS=( "gpl_dia|gpl|krow" )
