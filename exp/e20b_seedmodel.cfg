# E20b (HYBRID_PLACEMENT_PLAN.md §9.1 A1 + A2): the two cheap ways of giving
# the seeded split a model of where the cells actually are.
#   A1  a<alpha>: partitioner refinement (transport start, hpwl objective,
#       tether 0.3) with local pins modeled at alpha*center +
#       (1-alpha)*clamp(seed, child).  alpha 1 is the classical center model
#       (E20a); alpha 0 the exact-seed model, predicted to reproduce the
#       transport-only split (E19).
#   A2  n<lambda>: transport only, cost d(seed, box) + lambda * dHPWL
#       (net-aware transport, 2 Gauss-Seidel rounds).  lambda 0 is E19.
# Seeds: gpl -overflow tau, tau in {0.3, 0.5}.  Compare with
# results/e19_overflow and results/e20a_objective; watch hpwl_dpl (pre-DPO)
# and the per-level assignment_dhpwl_um in the .mcp.json.
EXP=e20b_seedmodel
OPENROAD="$ROOT/OpenROAD/build/bin/openroad"
DESIGNS="gcd_nangate45 aes_nangate45 ibex_sky130hd"
SEEDS="1 2 3"
THREADS=4
DPO=1
MCP="-k 2 -reserve minlocal -density \$::global_place_density -max_tolerance 1.0 -pad_left \$::global_place_pad -pad_right \$::global_place_pad -optimal_cells 12 -seed_placement -seed_terminals"
A1="$MCP -assignment transport -objective hpwl -displacement_weight 0.3"
A2="$MCP -assignment transport_only"
VARIANTS=(
  "t30_a0|mincut|$A1 -seed_spread 0|none|gpl_ovf0.3"
  "t30_a025|mincut|$A1 -seed_spread 0.25|none|gpl_ovf0.3"
  "t30_a05|mincut|$A1 -seed_spread 0.5|none|gpl_ovf0.3"
  "t50_a0|mincut|$A1 -seed_spread 0|none|gpl_ovf0.5"
  "t50_a025|mincut|$A1 -seed_spread 0.25|none|gpl_ovf0.5"
  "t50_a05|mincut|$A1 -seed_spread 0.5|none|gpl_ovf0.5"
  "t30_n05|mincut|$A2 -assignment_net_weight 0.5|none|gpl_ovf0.3"
  "t30_n1|mincut|$A2 -assignment_net_weight 1|none|gpl_ovf0.3"
  "t30_n2|mincut|$A2 -assignment_net_weight 2|none|gpl_ovf0.3"
  "t50_n05|mincut|$A2 -assignment_net_weight 0.5|none|gpl_ovf0.5"
  "t50_n1|mincut|$A2 -assignment_net_weight 1|none|gpl_ovf0.5"
  "t50_n2|mincut|$A2 -assignment_net_weight 2|none|gpl_ovf0.5"
)
