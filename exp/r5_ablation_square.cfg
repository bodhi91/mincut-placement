# R5 (review): the component ladder of E26b on the SQUARE floorplans of
# the main comparison (AR-1 base floorplans, x3_mega base_small
# conditions: seed 1, 4 threads, DPO on with the pre-DPO metric, soft
# blockages blocked, RePlAce in krow mode as the reference), so that the
# ablation table's square columns are measured against the same reference
# and on the same floorplans as the main results.  The last two rungs
# already exist: + leaf revisit = x3_mega cutnet_tp (RB), + level-wise
# reassignment = x3_mega kway_tp (RB+k).  Few-row column: E26b / E26 /
# x3_mega (exp/review_numbers.py section 4).
#   a0_base      cut-net bisection, one wave, uniform whitespace, no end
#                game (cells evenly spaced in rows), no leaf revisit
#   a1_waves     + two checkerboard waves
#   a2_minlocal  + connectivity-guided (minlocal) whitespace
#   a3_endgame   + exact bisection <= 16, branch-and-bound rows and order
#                <= 12, row ironing 7 x 2; even positions
#   a4_positions + optimal in-row positions (clumping)
# Binary: openroad-i1 (defaults reproduce x3).  Launch (host-B):
# exp/r_launch.sh r5 [-j N].
EXP=r5_ablation_square
OPENROAD="$ROOT/OpenROAD/build/bin/openroad"
DESIGNS="${R5_DESIGNS:-gcd_ar1_nangate45 gcd_ar1_asap7 aes_ar1_nangate45 aes_ar1_asap7 ibex_ar1_nangate45 ibex_ar1_asap7 jpeg_ar1_nangate45 jpeg_ar1_asap7}"
SEEDS="1"
THREADS=4
DPO=1
MEM_MIN_GB="${MEM_MIN_GB:-40}"
MEM_MAX_GB="${MEM_MAX_GB:-120}"
export MCP_CAPO_SOFT_BLOCKAGES=block
PAD="-pad_left \$::global_place_pad -pad_right \$::global_place_pad"
SB="-soft_blockages block"
NOEND="-exact_cells 0 -optimal_cells 0 -iron_window 0 -leaf_positions even"
END="-exact_cells 16 -optimal_cells 12 -iron_window 7 -iron_passes 2"
A0="-end_case_passes 1 -k 2 -reserve uniform -density \$::global_place_density $PAD -waves 1 $NOEND -feedback_passes 0 $SB"
A1="-end_case_passes 1 -k 2 -reserve uniform -density \$::global_place_density $PAD -waves 2 $NOEND -feedback_passes 0 $SB"
A2="-end_case_passes 1 -k 2 -reserve minlocal -density \$::global_place_density -max_tolerance 1.0 $PAD -waves 2 $NOEND -feedback_passes 0 $SB"
A3="-end_case_passes 1 -k 2 -reserve minlocal -density \$::global_place_density -max_tolerance 1.0 $PAD -waves 2 $END -leaf_positions even -feedback_passes 0 $SB"
A4="-end_case_passes 1 -k 2 -reserve minlocal -density \$::global_place_density -max_tolerance 1.0 $PAD -waves 2 $END -leaf_positions optimal -feedback_passes 0 $SB"
VARIANTS=(
  "a0_base|mincut|$A0"
  "a1_waves|mincut|$A1"
  "a2_minlocal|mincut|$A2"
  "a3_endgame|mincut|$A3"
  "a4_positions|mincut|$A4"
)
