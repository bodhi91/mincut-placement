# E23: the AR-1 base floorplans (base_designs/floorplan: ORFS designs, square
# die at 60 % utilization, macros placed by RTL-MP and fixed with 10 um soft-
# blockage halos, I/O pins fixed, cells unplaced; checkpoints from
# bench/make_base_checkpoints.tcl) with gpl, Capo and mcp under each of its
# four engines.  10 designs x 2 platforms; this file has the 8 designs up to
# xiangshan (420 k cells), exp/e23_base_big.cfg megaboom / mempool_group
# (1.7-3.0 M cells, no DPO).  Same results folder.
#
# Author's RePlAce baseline (post-dpl HPWL, no routing): summary_stats.csv.
#
# Settings reproduce the flow that made the floorplans: target density 0.70,
# no cell padding, no detail-placement padding.  Soft blockages (macro halos)
# are obstacles for every arm: gpl blocks every site under a soft blockage
# without MAXDENSITY, mcp with -soft_blockages block, Capo through
# MCP_CAPO_SOFT_BLOCKAGES=block (exported as fixed terminals).  Otherwise the
# E16/E17 conditions: DPO=1, -feedback_passes 1, 4 threads, seed 1.
#   gpl   global_placement as the author's baseline (krow mode:
#         -disable_pin_density_adjust -overflow 0.2)
#   capo  Capo 10.5, -densityTarget 70, no padding
#   tp / hm / mk / fp   mcp with TritonPart / hMETIS / Mt-KaHyPar / FastPart
# Binary: OpenROAD/build-e23 (E17's build + -soft_blockages; reproduces E16
# to the decimal on aes / ibex).
# Launch: exp/e23_launch.sh (screen session on host-A).
EXP=e23_base
OPENROAD="$ROOT/OpenROAD/build/bin/openroad"
PLATFORMS="asap7 nangate45"
BASE_DESIGNS="${BASE_DESIGNS:-gcd aes ibex jpeg swerv_wrapper cva6 mempool_tile xiangshan}"
DESIGNS=""
for d in $BASE_DESIGNS; do
  for p in $PLATFORMS; do
    DESIGNS="$DESIGNS ${d}_ar1_${p}"
  done
done
SEEDS="1"
THREADS=4
DPO="${DPO:-1}"
export MCP_CAPO_SOFT_BLOCKAGES=block
CAPO="${CAPO:-/path/to/UMpack/Capo/CapoTest1.exe}"
HMETIS="$ROOT/tools/hmetis/hmetis_driver"
MTKAHYPAR="${MTKAHYPAR:-/path/to/MtKaHyPar}"
FASTPART="$ROOT/tools/fastpart/fastpart_driver.py"
MCP="-k 2 -reserve minlocal -density \$::global_place_density -max_tolerance 1.0 -pad_left \$::global_place_pad -pad_right \$::global_place_pad -optimal_cells 12 -feedback_passes 1 -soft_blockages block"
VARIANTS=(
  "gpl|gpl|krow"
  "capo|capo|-densityTarget [expr {int(round(100*\$::global_place_density))}]|\$::global_place_pad"
  "tp|mincut|$MCP"
  "hm|mincut|$MCP -engine hmetis -hmetis_path $HMETIS"
  "mk|mincut|$MCP -engine mtkahypar -mtkahypar_path $MTKAHYPAR"
  "fp|mincut|$MCP -engine fastpart -fastpart_path $FASTPART"
)
# Memory gates (exp/run.sh): wait for MEM_MIN_GB free before a run, cap a
# run's address space at MEM_MAX_GB (global_route on xiangshan may need
# tens of GB; E17 shares the machine).
MEM_MIN_GB="${MEM_MIN_GB:-80}"
MEM_MAX_GB="${MEM_MAX_GB:-150}"
