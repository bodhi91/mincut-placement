# E21e (HYBRID_PLACEMENT_PLAN.md §9.2.1, the partitioner sweep): the
# adaptive hybrid of E21d -- QP oracle with utilization-scaled anchor
# (analytical terminal propagation) and ACG whitespace / balance with the
# whitespace-derived tolerance -- with each of the four partitioning engines,
# against the E16 baseline arms (tp, hm, mk, fp with minlocal).  Whether
# analytical information makes the partitioner choice matter less.
#   <eng>        baseline (E16 flow; tp and fp also in results/e21a_oracle)
#   <eng>_hyb    + -oracle qp -oracle_anchor 1 -oracle_anchor_util 1
#                  -reserve acg -balance_tolerance 0.5 -max_tolerance 1.0
EXP=e21e_engines
OPENROAD="$ROOT/OpenROAD/build/bin/openroad"
DESIGNS="gcd_nangate45 aes_nangate45 ibex_sky130hd"
SEEDS="1 2 3"
THREADS=4
DPO=1
HMETIS="$ROOT/tools/hmetis/hmetis_driver"
MTKAHYPAR="${MTKAHYPAR:-/path/to/MtKaHyPar}"
FASTPART="$ROOT/tools/fastpart/fastpart_driver.py"
COMMON="-k 2 -density \$::global_place_density -max_tolerance 1.0 -pad_left \$::global_place_pad -pad_right \$::global_place_pad -optimal_cells 12 -feedback_passes 1"
BASE="$COMMON -reserve minlocal"
HYB="$COMMON -reserve acg -balance_tolerance 0.5 -oracle qp -oracle_anchor 1 -oracle_anchor_util 1"
VARIANTS=(
  "hm|mincut|$BASE -engine hmetis -hmetis_path $HMETIS"
  "hm_hyb|mincut|$HYB -engine hmetis -hmetis_path $HMETIS"
  "mk|mincut|$BASE -engine mtkahypar -mtkahypar_path $MTKAHYPAR"
  "mk_hyb|mincut|$HYB -engine mtkahypar -mtkahypar_path $MTKAHYPAR"
  "tp_hyb|mincut|$HYB"
  "fp_hyb|mincut|$HYB -engine fastpart -fastpart_path $FASTPART"
)
