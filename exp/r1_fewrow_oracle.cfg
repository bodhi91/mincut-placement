# R1 (review, concern 1): is the few-row win the global solution or the
# back end?  The all-level oracle flow of I1 (arm oA: RePlAce decides
# every cell-to-region assignment through the American map, our
# whitespace allocation, end game and row ironing place the leaves) on a
# few-row subset: jpeg, swerv, cva6 at 70 % utilization, 1/2/4/6/8 rows,
# both PDKs = 30 floorplans, seed 1.  The seed is RePlAce in the few-row
# baseline mode (bench/mincut.tcl MCP_PRE=gpl_krow, the same command as
# the x3_mega gpl arm), computed in-process.
#
# Reading: oA near RB (TP) of x3_mega  -> the win belongs to the back end
#          oA near RePlAce / in between -> the win is in the assignments
# References: results/x3_mega gpl / cutnet_tp on the same floorplans.
# Conditions as x3_mega krow_big: THREADS=4, no DPO (pre-DPO metric), no
# routing.  Binary: openroad-i1 (am source; defaults reproduce x3).
# Launch (host-B): exp/r_launch.sh r1 [-j N].  Report: exp/r1_report.py.
EXP=r1_fewrow_oracle
OPENROAD="$ROOT/OpenROAD/build/bin/openroad"
DESIGNS=""
for d in jpeg swerv_no_macro cva6_no_macro; do
  for p in nangate45 asap7; do
    for r in 1 2 4 6 8; do
      DESIGNS="$DESIGNS ${d}_u70_r${r}_${p}"
    done
  done
done
[[ -n "${R1_DESIGNS:-}" ]] && DESIGNS="$R1_DESIGNS"
SEEDS="${SEEDS:-1}"
THREADS=4
DPO=0
export MCP_NO_ROUTE=1
MEM_MIN_GB="${MEM_MIN_GB:-40}"
MEM_MAX_GB="${MEM_MAX_GB:-120}"
MCP="-k 2 -reserve minlocal -density \$::global_place_density -max_tolerance 1.0 -pad_left \$::global_place_pad -pad_right \$::global_place_pad -optimal_cells 12 -feedback_passes 1"
ORACLE="-seed_placement -seed_terminals -assignment transport_only -no_seed_leaf"
VARIANTS=(
  "oA|mincut|$MCP $ORACLE|none|gpl_krow"
)
