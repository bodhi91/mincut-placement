# E15: FastPart as partitioning engine of the default flow (E12/E13
# conditions: DPO=1, -feedback_passes 1), against TritonPart and hMETIS on
# the same binary.  FastPart is a fixed-budget portfolio over Mt-KaHyPar
# (tools/fastpart/fastpart_driver.py), so the budget is the variable:
#   fp_top4    FastPart for levels 0-3 (15 regions, 5 s each), TritonPart below
#   fp_top6    FastPart for levels 0-5 (63 regions, 5 s each)
#   fp_all     FastPart on every region, 2 s budget, stop after 10 runs
#              without improvement
# Needs FastPart/external/mt-kahypar (tools/fastpart/build.sh) and
# numpy/scipy in the openroad-env python.  The first-pass arms ran with the
# first driver (one process per region) and the then defaults; the explicit
# -fastpart_decay 1 -fastpart_min_cells 0 -fastpart_stall 0 reproduce them
# with the current defaults (which are those of fp_s10_d5_st below).
EXP=e15_fastpart
DESIGNS="gcd_nangate45 aes_nangate45 ibex_sky130hd"
SEEDS="1 2 3"
THREADS=4
DPO=1
HMETIS="$ROOT/tools/hmetis/hmetis_driver"
FASTPART="$ROOT/tools/fastpart/fastpart_driver.py"
MCP="-k 2 -reserve minlocal -density \$::global_place_density -max_tolerance 1.0 -pad_left \$::global_place_pad -pad_right \$::global_place_pad -optimal_cells 12 -feedback_passes 1"
VARIANTS=(
  "fb1|mincut|$MCP"
  "hm_fb1|mincut|$MCP -engine hmetis -hmetis_path $HMETIS"
  "fp_top4|mincut|$MCP -top_engine fastpart -top_levels 4 -fastpart_path $FASTPART -fastpart_time 5 -fastpart_decay 1 -fastpart_min_cells 0 -fastpart_stall 0"
  "fp_top6|mincut|$MCP -top_engine fastpart -top_levels 6 -fastpart_path $FASTPART -fastpart_time 5 -fastpart_decay 1 -fastpart_min_cells 0 -fastpart_stall 0"
  "fp_all|mincut|$MCP -engine fastpart -fastpart_path $FASTPART -fastpart_time 2 -fastpart_decay 1 -fastpart_min_cells 0 -fastpart_stall 10"
)
# Attribution control (added after the first pass): under minlocal with
# -max_tolerance 1.0 the top-level bounds of aes / ibex are [0, S] and
# TritonPart peels off tiny groups (a 4-cell region at level 2 of aes) where
# FastPart splits evenly.  TritonPart with a tighter tolerance separates the
# balance effect from the cut quality.
VARIANTS+=(
  "fb1_t03|mincut|-k 2 -reserve minlocal -density \$::global_place_density -max_tolerance 0.3 -pad_left \$::global_place_pad -pad_right \$::global_place_pad -optimal_cells 12 -feedback_passes 1"
)
# Second pass: FastPart on every level with a level-scheduled budget
# (driver as a persistent server, Options::threads engine workers; budget
# fastpart_time * decay^level, floor 0.2 s; regions <= 16 cells -- what the
# exact end game solves anyway -- go to TritonPart).
#   fp_s10_d5    10 s at the root, halved per level (fixed budget everywhere)
#   fp_s20_d5    20 s at the root, halved per level
#   fp_s10_d7    10 s at the root, x0.7 per level (more in the middle)
#   fp_s10_d5_st fp_s10_d5 with -fastpart_stall 10 (early stop)
FPS="-engine fastpart -fastpart_path $FASTPART -fastpart_min_time 0.2 -fastpart_min_cells 16"
VARIANTS+=(
  "fp_s10_d5|mincut|$MCP $FPS -fastpart_time 10 -fastpart_decay 0.5 -fastpart_stall 0"
  "fp_s20_d5|mincut|$MCP $FPS -fastpart_time 20 -fastpart_decay 0.5 -fastpart_stall 0"
  "fp_s10_d7|mincut|$MCP $FPS -fastpart_time 10 -fastpart_decay 0.7 -fastpart_stall 0"
  "fp_s10_d5_st|mincut|$MCP $FPS -fastpart_time 10 -fastpart_decay 0.5 -fastpart_stall 10"
)
