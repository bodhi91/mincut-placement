# E21b (HYBRID_PLACEMENT_PLAN.md §9.2 B1 + B2; §9.2.1 H-term + H-bal): the
# QP oracle with weak anchors, and ACG whitespace / balance from the oracle
# mass.  Smoke tests on aes seed 1 (results/hybrid_build_b2.log era): the
# anchor range of E21a (0.3-3) is too stiff -- with anchor 1 every region's
# cells clump at the region center and ACG degenerates to a uniform,
# tightly balanced split (E5's uniform result); anchor 0.1 is better for
# terminal propagation too, and ACG with anchor 0.03 gave 416k post-DPO
# (tp 459k, gpl 399k).
#   tp_qp<a>        minlocal, oracle anchor a in {0.01, 0.03, 0.1}
#   tp_qp<a>_acg    -reserve acg (balance lambda +- 5 % from the mass
#                   rectangle of the oracle positions; whitespace where the
#                   mass is not), same anchors
#   tp_qp003_acg_nt acg from the oracle, but terminals stay at region
#                   centers (H-bal alone)
#   tp_qp003_acg_t2 acg with balance tolerance 0.2
# Baseline tp and gpl: results/e21a_oracle, results/e18_endgame_dpo.
EXP=e21b_anchor_acg
OPENROAD="$ROOT/OpenROAD/build/bin/openroad"
DESIGNS="gcd_nangate45 aes_nangate45 ibex_sky130hd"
SEEDS="1 2 3"
THREADS=4
DPO=1
MCP="-k 2 -reserve minlocal -density \$::global_place_density -max_tolerance 1.0 -pad_left \$::global_place_pad -pad_right \$::global_place_pad -optimal_cells 12 -feedback_passes 1"
ACG="-k 2 -reserve acg -density \$::global_place_density -pad_left \$::global_place_pad -pad_right \$::global_place_pad -optimal_cells 12 -feedback_passes 1"
VARIANTS=(
  "tp_qp001|mincut|$MCP -oracle qp -oracle_anchor 0.01"
  "tp_qp003|mincut|$MCP -oracle qp -oracle_anchor 0.03"
  "tp_qp01|mincut|$MCP -oracle qp -oracle_anchor 0.1"
  "tp_qp001_acg|mincut|$ACG -oracle qp -oracle_anchor 0.01"
  "tp_qp003_acg|mincut|$ACG -oracle qp -oracle_anchor 0.03"
  "tp_qp01_acg|mincut|$ACG -oracle qp -oracle_anchor 0.1"
  "tp_qp003_acg_nt|mincut|$ACG -oracle qp -oracle_anchor 0.03 -no_oracle_terminals"
  "tp_qp003_acg_t2|mincut|$ACG -oracle qp -oracle_anchor 0.03 -balance_tolerance 0.2"
)
