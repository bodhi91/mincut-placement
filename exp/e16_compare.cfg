# E16: the final comparison -- gpl, Capo, and the min-cut placer with each of
# its four partitioning engines -- on every checkpoint, one binary, the
# default flow (E12 conditions: DPO=1, -feedback_passes 1, 4 threads).
#   gpl        global_placement defaults (the ORFS flow)
#   capo       Capo 10.5 (CapoTest1 via bench/capo.tcl), padded cells at the
#              flow density: the E14 arm comparable to gpl / mcp
#   tp         mcp, TritonPart (the default engine)
#   hm         mcp, hMETIS 1.5.3
#   mk         mcp, Mt-KaHyPar 1.6.2 (default preset, cut objective, eps 3 %)
#   fp         mcp, FastPart (E15 defaults: 10 s at the root halved per level,
#              >= 0.2 s, <= 16 cells to TritonPart, early stop after 10 runs)
# CAPO = path to CapoTest1.exe (LD_LIBRARY_PATH must contain UMpack/lib).
EXP=e16_compare
DESIGNS="gcd_nangate45 aes_nangate45 tinyRocket_nangate45 ibex_sky130hd jpeg_sky130hd"
SEEDS="1 2 3"
THREADS=4
DPO=1
CAPO="${CAPO:-/path/to/UMpack/Capo/CapoTest1.exe}"
HMETIS="$ROOT/tools/hmetis/hmetis_driver"
MTKAHYPAR="${MTKAHYPAR:-/path/to/MtKaHyPar}"
FASTPART="$ROOT/tools/fastpart/fastpart_driver.py"
MCP="-k 2 -reserve minlocal -density \$::global_place_density -max_tolerance 1.0 -pad_left \$::global_place_pad -pad_right \$::global_place_pad -optimal_cells 12 -feedback_passes 1"
VARIANTS=(
  "gpl|gpl|default"
  "capo|capo|-densityTarget [expr {int(100*\$::global_place_density)}]|\$::global_place_pad"
  "tp|mincut|$MCP"
  "hm|mincut|$MCP -engine hmetis -hmetis_path $HMETIS"
  "mk|mincut|$MCP -engine mtkahypar -mtkahypar_path $MTKAHYPAR"
  "fp|mincut|$MCP -engine fastpart -fastpart_path $FASTPART"
)
