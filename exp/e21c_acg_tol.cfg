# E21c (HYBRID_PLACEMENT_PLAN.md §9.2.1 H-bal): the two halves of ACG
# separated.  E21b: on aes (4 % utilization) ACG from the oracle mass beats
# minlocal by 7-10 % and its balance tolerance matters (0.05: 1.040, 0.2:
# 1.012 x gpl); on ibex (44 %) ACG with 0.05 hurts (1.255 vs 1.232) and the
# stiff anchor 3 was the only thing that helped (1.196).  Here: tolerance
# {0.2, 0.5, 1.0} x anchor {0.03, 0.3, 1, 3}; tolerance 1.0 keeps only
# ACG's whitespace rule (the balance is free, as with minlocal
# -max_tolerance 1.0), so the sweep says whether the gain is the whitespace
# allocation or the balance ratio.  Plus minlocal with anchor 10 (ibex) and
# FastPart with E21b's best arm.
EXP=e21c_acg_tol
OPENROAD="$ROOT/OpenROAD/build/bin/openroad"
DESIGNS="gcd_nangate45 aes_nangate45 ibex_sky130hd"
SEEDS="1 2 3"
THREADS=4
DPO=1
FASTPART="$ROOT/tools/fastpart/fastpart_driver.py"
MCP="-k 2 -reserve minlocal -density \$::global_place_density -max_tolerance 1.0 -pad_left \$::global_place_pad -pad_right \$::global_place_pad -optimal_cells 12 -feedback_passes 1"
ACG="-k 2 -reserve acg -density \$::global_place_density -pad_left \$::global_place_pad -pad_right \$::global_place_pad -optimal_cells 12 -feedback_passes 1 -oracle qp"
VARIANTS=(
  "acg_a003_t05|mincut|$ACG -oracle_anchor 0.03 -balance_tolerance 0.5"
  "acg_a003_t1|mincut|$ACG -oracle_anchor 0.03 -balance_tolerance 1.0"
  "acg_a03_t02|mincut|$ACG -oracle_anchor 0.3 -balance_tolerance 0.2"
  "acg_a03_t05|mincut|$ACG -oracle_anchor 0.3 -balance_tolerance 0.5"
  "acg_a1_t02|mincut|$ACG -oracle_anchor 1 -balance_tolerance 0.2"
  "acg_a1_t05|mincut|$ACG -oracle_anchor 1 -balance_tolerance 0.5"
  "acg_a3_t02|mincut|$ACG -oracle_anchor 3 -balance_tolerance 0.2"
  "acg_a3_t05|mincut|$ACG -oracle_anchor 3 -balance_tolerance 0.5"
  "tp_qp10|mincut|$MCP -oracle qp -oracle_anchor 10"
  "fp_acg_a003_t02|mincut|$ACG -engine fastpart -fastpart_path $FASTPART -oracle_anchor 0.03 -balance_tolerance 0.2"
)
