# E21a (HYBRID_PLACEMENT_PLAN.md §9.2 B1 + B3, the H-term / H-model rows of
# §9.2.1): the QP oracle inside the from-scratch tree.  After every level a
# bound-to-bound quadratic placement of all cells, each anchored to its
# region's center (weight oracle_anchor * degree / region size), gives the
# next level's splits real positions for the outside cells (analytical
# terminal propagation, ATP) instead of region centers; with -seed_spread
# the oracle positions also enter the net costs of the hpwl objective
# (which pins are near which side).
#   tp            baseline, TritonPart (E16 arm)
#   tp_qp<a>      + oracle, anchor a in {0.3, 1, 3}
#   tp_qp1_h      + oracle anchor 1, hpwl objective, center model (control
#                 for the next arm)
#   tp_qp1_h_a05  + oracle anchor 1, hpwl objective, local pins modeled at
#                 0.5 center + 0.5 clamp(oracle, child)
#   fp, fp_qp1    the same with FastPart (E16's best engine)
# Reference: results/e16_compare (gpl, tp, fp on the same designs) and
# results/e18_endgame_dpo (gpl).  Per-level oracle_hpwl_um / oracle_seconds
# in the .mcp.json.
EXP=e21a_oracle
OPENROAD="$ROOT/OpenROAD/build/bin/openroad"
DESIGNS="gcd_nangate45 aes_nangate45 ibex_sky130hd"
SEEDS="1 2 3"
THREADS=4
DPO=1
FASTPART="$ROOT/tools/fastpart/fastpart_driver.py"
MCP="-k 2 -reserve minlocal -density \$::global_place_density -max_tolerance 1.0 -pad_left \$::global_place_pad -pad_right \$::global_place_pad -optimal_cells 12 -feedback_passes 1"
FP="$MCP -engine fastpart -fastpart_path $FASTPART"
VARIANTS=(
  "tp|mincut|$MCP"
  "tp_qp03|mincut|$MCP -oracle qp -oracle_anchor 0.3"
  "tp_qp1|mincut|$MCP -oracle qp -oracle_anchor 1"
  "tp_qp3|mincut|$MCP -oracle qp -oracle_anchor 3"
  "tp_qp1_h|mincut|$MCP -oracle qp -oracle_anchor 1 -objective hpwl"
  "tp_qp1_h_a05|mincut|$MCP -oracle qp -oracle_anchor 1 -objective hpwl -seed_spread 0.5"
  "fp|mincut|$FP"
  "fp_qp1|mincut|$FP -oracle qp -oracle_anchor 1"
)
