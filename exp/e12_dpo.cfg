# E12: detailed placement optimization (dpl improve_placement: independent
# set matching, global swaps, vertical swaps, reordering, random moves) in
# the evaluation flow, as ORFS runs it.  Every variant is legalized, then
# optimized, then routed; hpwl_dpl keeps the HPWL before the optimization.
#   gpl        global_placement (the baseline under the same flow)
#   fb1        the from-scratch default
#   fb4        -feedback_passes 4 (the quality setting)
EXP=e12_dpo
DESIGNS="gcd_nangate45 aes_nangate45 ibex_sky130hd"
SEEDS="1 2 3"
THREADS=4
DPO=1
MCP="-k 2 -reserve minlocal -density \$::global_place_density -max_tolerance 1.0 -pad_left \$::global_place_pad -pad_right \$::global_place_pad -optimal_cells 12"
VARIANTS=(
  "gpl|gpl|default"
  "fb1|mincut|$MCP -feedback_passes 1"
  "fb4|mincut|$MCP -feedback_passes 4"
)
