# E20a (HYBRID_PLACEMENT_PLAN.md §9.1 A0): the refinement E19b should have
# run.  E19b refined the transport split of the early-stopped gpl seed with
# the default objective, which -displacement_weight turns into conn (the cut
# indicator): the net term had no notion of distance.  Here the partitioner
# runs the hpwl / rsmt vector objectives (external pins at their seed
# positions through -seed_terminals, local pins at the child centers) with
# the same tether.  Zero new code.
#   t<tau>_<obj>_d<delta>   gpl -overflow tau -> transport + refinement with
#                           objective obj and tether delta -> end game, DPO
# Compare with results/e19_overflow (transport_only, same tau) and
# results/e19b_refine (conn, same tau and delta).  hpwl_dpl (pre-DPO) matters
# as much as hpwl.
EXP=e20a_objective
OPENROAD="$ROOT/OpenROAD/build/bin/openroad"
DESIGNS="gcd_nangate45 aes_nangate45 ibex_sky130hd"
SEEDS="1 2 3"
THREADS=4
DPO=1
MCP="-k 2 -reserve minlocal -density \$::global_place_density -max_tolerance 1.0 -pad_left \$::global_place_pad -pad_right \$::global_place_pad -optimal_cells 12"
SEEDED="$MCP -seed_placement -assignment transport -seed_terminals"
VARIANTS=(
  "t30_hpwl_d03|mincut|$SEEDED -objective hpwl -displacement_weight 0.3|none|gpl_ovf0.3"
  "t30_hpwl_d1|mincut|$SEEDED -objective hpwl -displacement_weight 1|none|gpl_ovf0.3"
  "t30_rsmt_d1|mincut|$SEEDED -objective rsmt -displacement_weight 1|none|gpl_ovf0.3"
  "t50_hpwl_d03|mincut|$SEEDED -objective hpwl -displacement_weight 0.3|none|gpl_ovf0.5"
  "t50_hpwl_d1|mincut|$SEEDED -objective hpwl -displacement_weight 1|none|gpl_ovf0.5"
  "t50_rsmt_d1|mincut|$SEEDED -objective rsmt -displacement_weight 1|none|gpl_ovf0.5"
)
