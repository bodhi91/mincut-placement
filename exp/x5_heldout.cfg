# X5: RePlAce against RB+k (TP) on the second batch of floorplans from the
# floorplan author (floorplan tree dated
# 2026-11-12): seven new designs, b19 ethernet fft_256 jpegencode tate_151
# tate_pairing vga_lcd, on both PDKs, in the same two shapes as the paper's
# sets and made by the same flow (OpenROAD e2820c8, debuffered ORFS synthesis,
# global_placement -skip_io -disable_pin_density_adjust -overflow 0.2 for pin
# placement, cells unplaced):
#   k-row   {60,70,80} % x {1,2,4,6,8} rows = 15 per design/PDK, 210 floorplans
#           (k-row-floorplans/floorplan/<pdk>/<design>/<util>/<rows>.odb,
#           checkpoints by bench/make_krow_checkpoints.tcl)
#   ar1     square die at 60 %, 14 floorplans
#           (base_designs/floorplan/<pdk>/<design>/60/ar1.odb,
#           checkpoints by bench/make_base_checkpoints.tcl)
# Cells (nangate45 / asap7): ethernet 46k, vga_lcd 86k, b19 103k / 95k,
# tate_151 118k / 100k, tate_pairing 269k / 235k, fft_256 236k / 221k,
# jpegencode 363k / 429k.
# No macros anywhere.
#
# Arms, as in X3 (exp/x3_mega.cfg), seed 1, 4 threads:
#   gpl      RePlAce reference, krow mode (-disable_pin_density_adjust
#            -overflow 0.2, density from vars.tcl: max(0.70, u+0.01) on the
#            k-row set, 0.70 on ar1)
#   kway_tp  RB+k (TP): -k 2 -reserve minlocal, TritonPart, terminal
#            propagation, exact end game, -kway_refine_levels {2 3 4 5}
# Binary: OpenROAD/build/bin/openroad (the X3 binary).
#
# Design groups (X5_SET), with the X3 conditions for the same cell counts:
#   krow_small  ethernet (46k cells), DPO, routed            (X3 krow_small)
#   krow_big    the other six (87k-429k cells): no DPO (improve_placement ran
#               for hours on the 1-2-row dies of the 80k-cell designs) and no
#               routing (global_route exhausted 100+ GB on them in E17)
#   base        all seven on the square die, DPO, routed, soft blockages n/a
#               (no macros); global_route on the 235k-429k-cell designs takes
#               hours to a day each (xiangshan, 422k cells, took 27-32 h)
# X5_DPO=0 overrides the DPO of krow_small for a rerun: on
# ethernet_u60_r1_nangate45 (a 215 mm x 14 um die) improve_placement had not
# finished after 3.5 h and was killed; that RB+k run was redone with X5_DPO=0
# MCP_NO_ROUTE=1 (the primary metric, HPWL after detailed placement, does
# not depend on DPO; routing on that die fails for every placer).
# RB+k on ethernet_ar1_nangate45 crashed (SIGSEGV, level-4 k-way
# refinement) in Mt-KaHyPar's greedy one-to-one mapping; fixed by
# tools/mtkahypar/patches/greedy_mapping_empty_candidates.patch (library
# rebuilt Nov 17 00:26; the patch changes nothing where the old library
# did not crash).
# 224 floorplans x 2 arms = 448 runs.  Launch: exp/x5_launch.sh; every pass
# is resumable.
EXP=x5_heldout
OPENROAD="$ROOT/OpenROAD/build/bin/openroad"
X5_SET="${X5_SET:-krow_small}"
THREADS=4
SEEDS="1"
NEW_DESIGNS="b19 ethernet fft_256 jpegencode tate_151 tate_pairing vga_lcd"
krow_grid() {  # <designs...> -> DESIGNS over platforms x utilizations x rows
  local d p u r
  DESIGNS=""
  for d in "$@"; do
    for p in nangate45 asap7; do
      for u in 60 70 80; do
        for r in 1 2 4 6 8; do
          DESIGNS="$DESIGNS ${d}_u${u}_r${r}_${p}"
        done
      done
    done
  done
}
base_grid() {  # <designs...> -> DESIGNS over platforms (AR-1 base floorplans)
  local d p
  DESIGNS=""
  for d in "$@"; do
    for p in nangate45 asap7; do
      DESIGNS="$DESIGNS ${d}_ar1_${p}"
    done
  done
}
case "$X5_SET" in
  krow_small) krow_grid ethernet; DPO="${X5_DPO:-1}"
              MEM_MIN_GB="${MEM_MIN_GB:-40}";  MEM_MAX_GB="${MEM_MAX_GB:-120}" ;;
  krow_big)   krow_grid b19 vga_lcd tate_151 tate_pairing fft_256 jpegencode; DPO=0
              export MCP_NO_ROUTE=1
              MEM_MIN_GB="${MEM_MIN_GB:-80}";  MEM_MAX_GB="${MEM_MAX_GB:-120}" ;;
  base)       base_grid $NEW_DESIGNS; DPO=1
              MEM_MIN_GB="${MEM_MIN_GB:-80}";  MEM_MAX_GB="${MEM_MAX_GB:-150}" ;;
  *) echo "X5_SET=$X5_SET unknown" >&2; exit 1 ;;
esac
MCP="-k 2 -reserve minlocal -density \$::global_place_density -max_tolerance 1.0 -pad_left \$::global_place_pad -pad_right \$::global_place_pad -optimal_cells 12 -feedback_passes 1"
VARIANTS=(
  "gpl|gpl|krow"
  "kway_tp|mincut|$MCP -kway_refine_levels {2 3 4 5}"
)
# X5_DESIGNS restricts the set's grid to the listed floorplans (reruns).
[[ -n "${X5_DESIGNS:-}" ]] && DESIGNS="$X5_DESIGNS"
