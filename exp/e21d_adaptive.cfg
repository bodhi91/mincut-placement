# E21d (HYBRID_PLACEMENT_PLAN.md §9.2.1 H-term + H-bal, adaptive): the
# settings E21c found by hand on each design, as rules of the region's
# utilization.  (1) ACG's balance tolerance is now derived from the
# whitespace above the target density like minlocal's -- (d - own) / own
# clamped to [-balance_tolerance, -max_tolerance] -- so sparse regions get
# a free balance (aes: 1.0) and dense ones the floor (ibex).  (2) The
# oracle anchor is scaled by (own / d)^-oracle_anchor_util, so sparse
# regions anchor weakly (the nets place the mass) and dense ones stiffly.
#   acg_f<floor>_a<anchor>[u1]   floor = -balance_tolerance; u1 = utilization
#                                exponent 1
#   fp_...                        the same with FastPart
# Reference: results/e21c_acg_tol (aes best 0.986 at a0.03 t1.0, ibex best
# 1.164 at a1 t0.5), results/e21a_oracle (tp 1.139 / 1.221).
EXP=e21d_adaptive
OPENROAD="$ROOT/OpenROAD/build/bin/openroad"
DESIGNS="gcd_nangate45 aes_nangate45 ibex_sky130hd"
SEEDS="1 2 3"
THREADS=4
DPO=1
FASTPART="$ROOT/tools/fastpart/fastpart_driver.py"
ACG="-k 2 -reserve acg -density \$::global_place_density -max_tolerance 1.0 -pad_left \$::global_place_pad -pad_right \$::global_place_pad -optimal_cells 12 -feedback_passes 1 -oracle qp"
VARIANTS=(
  "acg_f05_a003|mincut|$ACG -balance_tolerance 0.5 -oracle_anchor 0.03"
  "acg_f05_a1u1|mincut|$ACG -balance_tolerance 0.5 -oracle_anchor 1 -oracle_anchor_util 1"
  "acg_f05_a05u1|mincut|$ACG -balance_tolerance 0.5 -oracle_anchor 0.5 -oracle_anchor_util 1"
  "acg_f02_a05u1|mincut|$ACG -balance_tolerance 0.2 -oracle_anchor 0.5 -oracle_anchor_util 1"
  "acg_f005_a05u1|mincut|$ACG -balance_tolerance 0.05 -oracle_anchor 0.5 -oracle_anchor_util 1"
  "fp_acg_f05_a05u1|mincut|$ACG -engine fastpart -fastpart_path $FASTPART -balance_tolerance 0.5 -oracle_anchor 0.5 -oracle_anchor_util 1"
)
