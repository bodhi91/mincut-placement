# I1: cut quality versus information -- where does the square-die gap of
# recursive min-cut placement (~1.17x gpl HPWL) come from?  Three factors
# are separated on six square (AR 1) floorplans without macros, two seeds,
# same tree / capacity policy / end game / DPO in every arm (= x3 cutnet_tp
# conditions; THREADS=4, DPO=1, routed, -reserve minlocal, -max_tolerance
# 1.0, soft blockages blocked, gpl reference in krow mode as x3_mega):
#
#   A. cut quality, information fixed (standard terminal propagation)
#      ctl      the control (= x3 cutnet_tp)
#      deg10..deg100   every bisection worsened by balance-preserving random
#               swaps to >= 1.10 / 1.25 / 1.50 / 2.00 x the engine's cut
#               (achieved values in levels[].degrade_cut_before/after)
#      imp      better cuts: best of 4 TritonPart runs per bisection, 10
#               FM passes instead of 2 (achieved cut in levels[].cut_nets
#               against ctl)
#   B. information, algorithm fixed (TritonPart, cut-net objective)
#      oT       oracle terminals: the unplaced cells outside a region are
#               assumed at their gpl position (seed = full gpl, used for
#               the terminals / external pull only); the partitioner still
#               decides every bisection from scratch (-am_commit mincut);
#               the gpl-derived (transport) assignment of the same region
#               under the same bounds is computed alongside and its cut
#               recorded (levels[].am_cut_transport vs am_cut_mincut)
#      oA       oracle assignment: the gpl-derived transport assignment
#               decides every bisection (American map, AM-1 arm AMg), the
#               leaves ordered by netlist pull like every other arm
#               (-no_seed_leaf: gpl coordinates do not reach the end case)
#   C. objective x information (can the objective use the information?)
#      hp       geometric HPWL-vector objective, standard terminals
#      hp_oT    the same objective with the oracle terminals
#
# Binary: OpenROAD/build/bin/openroad (am source + -cut_degrade,
# -engine_runs, -no_seed_leaf, am_cut_* / degrade_* level statistics;
# defaults reproduce am/x3).  Launch (host-B only): exp/i1_launch.sh.
# Results: results/i1_info; report: exp/i1_report.py.
EXP=i1_info
OPENROAD="$ROOT/OpenROAD/build/bin/openroad"
DESIGNS="aes_ar1_nangate45 ibex_ar1_asap7 jpeg_ar1_nangate45 swerv_wrapper_ar1_nangate45 cva6_ar1_asap7 mempool_tile_ar1_nangate45"
# Review (R2): jpeg_ar1_asap7 added so that every arm exists on the four
# H3 floorplans of E27/E28 (aes NG45, ibex ASAP7, jpeg NG45, jpeg ASAP7).
[[ -n "${I1_DESIGNS:-}" ]] && DESIGNS="$I1_DESIGNS"
SEEDS="${SEEDS:-1 2}"
THREADS=4
DPO=1
MEM_MIN_GB="${MEM_MIN_GB:-40}"
MEM_MAX_GB="${MEM_MAX_GB:-120}"
export MCP_CAPO_SOFT_BLOCKAGES=block

MCP="-k 2 -reserve minlocal -density \$::global_place_density -max_tolerance 1.0 -pad_left \$::global_place_pad -pad_right \$::global_place_pad -optimal_cells 12 -feedback_passes 1 -soft_blockages block"
# Seed-located terminals, gpl-derived assignment computed; what decides is
# set per arm.  The leaves never see the seed.
ORACLE="-seed_placement -seed_terminals -assignment transport_only -no_seed_leaf"
I1_WAVE="${I1_WAVE:-all}"
VARIANTS=()
case "$I1_WAVE" in
  all|core)
    VARIANTS+=(
      "gpl|gpl|krow"
      "ctl|mincut|$MCP"
      "oT|mincut|$MCP $ORACLE -am_diagnose -am_commit mincut|none|gpl"
      "oA|mincut|$MCP $ORACLE|none|gpl"
      "hp|mincut|$MCP -objective hpwl"
      "hp_oT|mincut|$MCP -objective hpwl $ORACLE -am_diagnose -am_commit mincut|none|gpl"
      "imp|mincut|$MCP -engine_runs 4 -refiner_iters 10"
    ) ;;&
  all|degrade)
    VARIANTS+=(
      "deg10|mincut|$MCP -cut_degrade 0.10"
      "deg25|mincut|$MCP -cut_degrade 0.25"
      "deg50|mincut|$MCP -cut_degrade 0.50"
      "deg100|mincut|$MCP -cut_degrade 1.00"
    ) ;;
esac
