# E13: partitioning engine under the current default flow (E12 conditions:
# improve_placement in the evaluation).  TritonPart is E12 fb1; this grid
# adds hMETIS with the same options so that gpl / mcp(TritonPart) /
# mcp(hMETIS) are comparable on one flow and one binary.
EXP=e13_engines
DESIGNS="gcd_nangate45 aes_nangate45 ibex_sky130hd"
SEEDS="1 2 3"
THREADS=4
DPO=1
HMETIS="$ROOT/tools/hmetis/hmetis_driver"
MCP="-k 2 -reserve minlocal -density \$::global_place_density -max_tolerance 1.0 -pad_left \$::global_place_pad -pad_right \$::global_place_pad -optimal_cells 12"
VARIANTS=(
  "hm_fb1|mincut|$MCP -engine hmetis -hmetis_path $HMETIS -feedback_passes 1"
)
