# E24b: hybrid B (QP oracle terminals + ACG whitespace, adaptive setting; see
# exp/e24_hyb_krow.cfg) on the E23 AR-1 base floorplans (base_designs:
# square die at 60 % utilization, macros placed and fixed with soft-blockage
# halos, I/O pins fixed), so that it can be compared with the E23 arms
# (results/e23_base: gpl, capo, tp, hm, mk, fp) design by design.  Same
# designs, settings and evaluation as exp/e23_base.cfg: 8 designs x 2
# platforms (megaboom / mempool_group of e23_base_big.cfg not run here),
# target density 0.70, no padding, soft blockages blocked, DPO=1, 4 threads,
# seed 1.  Two engines: TritonPart and FastPart.
# Note: the ACG mass rectangle accounts for obstacles only through the
# region's usable fraction (uniformly); a child mostly under a macro gets a
# mass share it cannot hold, which massBounds() clamps to the child's usable
# area.  Good enough for a first run on macro designs; revisit if the macro
# designs behave differently from the macro-free ones.
EXP=e24_hyb_base
# Scratch (checkpoints in flight) in the workspace, not /tmp (2026-11-02).
export MCP_SCRATCH="$ROOT/scratch/$EXP"
OPENROAD="$ROOT/OpenROAD/build/bin/openroad"
PLATFORMS="asap7 nangate45"
BASE_DESIGNS="${BASE_DESIGNS:-gcd aes ibex jpeg swerv_wrapper cva6 mempool_tile xiangshan}"
DESIGNS=""
for d in $BASE_DESIGNS; do
  for p in $PLATFORMS; do
    DESIGNS="$DESIGNS ${d}_ar1_${p}"
  done
done
SEEDS="1"
THREADS=4
DPO="${DPO:-1}"
FASTPART="$ROOT/tools/fastpart/fastpart_driver.py"
COMMON="-k 2 -density \$::global_place_density -max_tolerance 1.0 -pad_left \$::global_place_pad -pad_right \$::global_place_pad -optimal_cells 12 -feedback_passes 1 -soft_blockages block"
HYB="$COMMON -reserve acg -balance_tolerance 0.5 -oracle qp -oracle_anchor 1 -oracle_anchor_util 1"
VARIANTS=(
  "tp_hyb|mincut|$HYB"
  "fp_hyb|mincut|$HYB -engine fastpart -fastpart_path $FASTPART"
)
MEM_MIN_GB="${MEM_MIN_GB:-80}"
MEM_MAX_GB="${MEM_MAX_GB:-150}"
