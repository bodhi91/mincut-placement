# E14: Capo 10.5 (UMpack, CapoTest1 through the Bookshelf bridge in
# bench/capo.tcl) under the E12 flow (DPO=1), against gpl and the mcp
# default.  CAPO = path to CapoTest1.exe (built from the UMpack mirror with
# the conda gcc 13; LD_LIBRARY_PATH must contain UMpack/lib).
#   capo        CapoTest1 defaults (minLocalWS 2.5 %, safeWS 5 %: cells packed)
#   capo_dens   -densityTarget <flow density %>: Capo's ISPD06-style whitespace
#               allocation at the same target density as gpl / mcp
#   capo_hard   -tryHarder: more multilevel starts
EXP=e14_capo
DESIGNS="gcd_nangate45 aes_nangate45 ibex_sky130hd"
SEEDS="1 2 3"
THREADS=4
DPO=1
CAPO="${CAPO:-/path/to/UMpack/Capo/CapoTest1.exe}"
MCP="-k 2 -reserve minlocal -density \$::global_place_density -max_tolerance 1.0 -pad_left \$::global_place_pad -pad_right \$::global_place_pad -optimal_cells 12"
VARIANTS=(
  "gpl|gpl|default"
  "fb1|mincut|$MCP -feedback_passes 1"
  "capo|capo|"
  "capo_dens|capo|-densityTarget [expr {int(100*\$::global_place_density)}]"
  "capo_hard|capo|-tryHarder"
)
# Added after the first pass: padded cells (gpl's -pad) at the target
# density, the arm comparable to mcp (unpadded Capo packs to ~97 % local
# density; dpl then cannot insert the detail-placement padding on ibex).
VARIANTS+=(
  "capo_pad_dens|capo|-densityTarget [expr {int(100*\$::global_place_density)}]|\$::global_place_pad"
)
# Density semantics control: Capo's -densityTarget bounds the *unpadded*
# cell area per bin; gpl / mcp pad the cells first.  These arms give gpl and
# mcp the same reading (no padding, same density).
VARIANTS+=(
  "gpl_nopad|gpl|nopad"
  "fb1_nopad|mincut|-k 2 -reserve minlocal -density \$::global_place_density -max_tolerance 1.0 -optimal_cells 12 -feedback_passes 1"
)
