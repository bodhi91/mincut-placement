# E18 (HYBRID_PLACEMENT_PLAN.md step 1): does the min-cut end game beat gpl
# *after* improve_placement?  E9/E10 measured gpl -> mcp(transport_only) ->
# end game at 0.945x gpl+dpl on aes before the optimizer; E12 added the
# optimizer to the flow but never ran this arm under it.  Sets the ceiling of
# the hybrid's back end.
#   gpl           global_placement defaults, the flow baseline
#   gpl_tonly_st  gpl seed -> transport-only decomposition with seed-located
#                 terminals -> end game (E11's gpl_tonly_st), under DPO
# Decision: gpl_tonly_st / gpl <= 0.98 -> the end game is a post-DPO margin
# (plan section 4.5 holds); >= 1.02 -> the 4.5 % was pre-DPO only.
# Binary: the hybrid build tree (OpenROAD/build-hybrid), never OpenROAD/build
# while a grid is using it.
EXP=e18_endgame_dpo
OPENROAD="$ROOT/OpenROAD/build/bin/openroad"
DESIGNS="gcd_nangate45 aes_nangate45 ibex_sky130hd"
SEEDS="1 2 3"
THREADS=4
DPO=1
MCP="-k 2 -reserve minlocal -density \$::global_place_density -max_tolerance 1.0 -pad_left \$::global_place_pad -pad_right \$::global_place_pad -optimal_cells 12"
SEEDED="$MCP -seed_placement -assignment transport_only -seed_terminals"
VARIANTS=(
  "gpl|gpl|default"
  "gpl_tonly_st|mincut|$SEEDED|none|gpl"
)
